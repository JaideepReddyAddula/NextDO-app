<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Todo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center p-6">

  <div class="w-full max-w-lg p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-semibold mb-6 text-center">Add Todo</h2>

    <form id="todoForm">
      <div class="mb-4">
        <label for="title" class="block text-lg font-medium mb-2">Title</label>
        <input type="text" id="title" name="title" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <div class="mb-4">
        <label for="description" class="block text-lg font-medium mb-2">Description</label>
        <textarea id="description" name="description" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" required></textarea>
      </div>

      <div class="mb-4">
        <label for="priority" class="block text-lg font-medium mb-2">Priority</label>
        <select id="priority" name="priority" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          <option value="Low">Low</option>
          <option value="High">High</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="status" class="block text-lg font-medium mb-2">Status</label>
        <select id="status" name="status" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 text-lg">Add Todo</button>
    </form>
  </div>

  <script>
    document.getElementById('todoForm').addEventListener('submit', function(e) {
        e.preventDefault();
  
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const priority = document.getElementById('priority').value;
        const status = document.getElementById('status').value;
  
        const newTodo = {
    title: title,
    description: description,
    priority: priority === "Low",  // true if Low
    status: status === "Completed" // true if Completed
};
  
        fetch('http://localhost:8080/api/todos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(newTodo)
        })
        .then(response => {
            if (response.ok) {
                window.location.href = 'TodoList.html';
            } else {
                alert('Error adding todo');
            }
        })
        .catch(error => {
            console.error("Error adding todo:", error);
        });
    });
  </script>
  
</body>
</html>
